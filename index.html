<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index Archive</title>
<meta name="description" content="Closed name index from open published sources: city directories, printed lists. Not Yad Vashem or JewishGen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3eee4;
    --ink: #241914;
    --muted: #6a5a50;
    --rule: #d4c6b4;
    --accent: #6b3a2a;
    --gold: #b0894a;
    --card: rgba(255,252,246,.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 18px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: .35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.12'/></svg>");
  }
  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 1.4rem 1.3rem 4rem; }
  header {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding-bottom: .9rem; border-bottom: 1px solid var(--rule);
  }
  .mark { font-family: Newsreader, Georgia, serif; font-weight: 700; letter-spacing: .02em; }
  .mark small { display: block; font-weight: 400; font-size: .72rem; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; margin-top: .15rem; }
  .langs { display: flex; gap: .25rem; }
  .langs button {
    font: inherit; font-size: .8rem; background: transparent; border: 1px solid var(--rule);
    color: var(--muted); padding: .28rem .55rem; cursor: pointer; border-radius: 3px;
  }
  .langs button.on { color: var(--ink); border-color: var(--ink); background: #fff; }
  h1 {
    font-family: Newsreader, Georgia, serif;
    font-size: clamp(2.1rem, 6vw, 3.6rem);
    line-height: 1.12; font-weight: 700; margin: 2.2rem 0 .8rem; max-width: 18ch;
  }
  .lede { font-size: 1.15rem; color: var(--muted); max-width: 42ch; margin: 0 0 1.6rem; }
  .cta {
    display: inline-block; background: var(--accent); color: #f3eadf; text-decoration: none;
    padding: .7rem 1.15rem; border-radius: 3px; font-weight: 500;
  }
  .cta:hover { filter: brightness(1.08); }
  .note { display: block; margin-top: .55rem; font-size: .82rem; color: var(--muted); }

  .banner {
    margin: 2.4rem 0 0;
    padding: 1.15rem 1.2rem 1.2rem;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, #fffaf0, #f7f0e2);
    position: relative;
  }
  .banner::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--gold);
  }
  .banner strong {
    display: block; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: .35rem;
  }
  .banner p { margin: 0; font-family: Newsreader, Georgia, serif; font-size: 1.25rem; line-height: 1.35; }

  .snaps {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.6rem 1.4rem;
    margin: 1.2rem 0 0;
  }
  @media (max-width: 720px) { .snaps { grid-template-columns: 1fr; } }
  figure.snap {
    margin: 0;
    background: #fffdf8;
    padding: .5rem .5rem 0;
    border: 1px solid #e6dccb;
    box-shadow: 0 22px 50px rgba(36,25,20,.13);
    transform: rotate(-.8deg);
    min-height: 0;
  }
  figure.snap:nth-child(2) { transform: rotate(1deg); margin-top: 1.4rem; }
  figure.snap:nth-child(3) { transform: rotate(.7deg); }
  figure.snap:nth-child(4) { transform: rotate(-1.1deg); margin-top: 1.4rem; }
  figure.snap img {
    width: 100%; height: 320px; object-fit: cover; object-position: top center;
    display: block; background: #ddd;
  }
  figure.snap figcaption { padding: .75rem .4rem .9rem; }
  figure.snap .k { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  figure.snap h3 { font-family: Newsreader, Georgia, serif; font-size: 1.12rem; margin: .15rem 0 .25rem; }
  figure.snap .ex {
    margin: 0; color: var(--muted); font-size: .88rem;
  }
  figure.snap .ex b { color: var(--ink); font-weight: 600; background: #f3eadf; padding: 0 .2rem; }

  h2 { font-family: Newsreader, Georgia, serif; font-size: 1.45rem; margin: 2.6rem 0 .8rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .8rem; }
  article {
    background: var(--card); border: 1px solid var(--rule); padding: 1rem 1.05rem;
    min-height: 8.5rem;
  }
  article h3 { margin: 0 0 .35rem; font-size: .95rem; }
  article p { margin: 0; color: var(--muted); font-size: .92rem; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; }
  @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
  ul { margin: .3rem 0 0; padding-inline-start: 1.1rem; color: var(--muted); }
  li { margin: .25rem 0; }
  .no { color: var(--accent); }
  footer {
    margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule);
    font-size: .82rem; color: var(--muted);
  }
  [dir="rtl"] h1 { max-width: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Index Archive<small id="mark_sub"></small></div>
    <div class="langs" role="group">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="he">עב</button>
    </div>
  </header>

  <h1 id="t_h1"></h1>
  <p class="lede" id="t_lede"></p>
  <a class="cta" id="t_cta" href="https://www.demidov.co.il/arhiv/"></a>
  <span class="note" id="t_cta_note"></span>

  <div class="banner">
    <strong id="t_open_k"></strong>
    <p id="t_open"></p>
  </div>

  <h2 id="t_ex_h"></h2>
  <p class="lede" id="t_ex_lede" style="margin-bottom:1rem"></p>
  <div class="snaps" id="snaps"></div>

  <h2 id="t_src_h"></h2>
  <div class="grid" id="src_grid"></div>

  <div class="cols">
    <div>
      <h2 id="t_yes_h"></h2>
      <ul id="t_yes"></ul>
    </div>
    <div>
      <h2 class="no" id="t_no_h"></h2>
      <ul id="t_no"></ul>
    </div>
  </div>

  <footer id="t_foot"></footer>
</div>
<script>

    cta: "Открыть индекс",

    ex_h: "Как это выглядит",
    ex_lede: "Страницы из тех же книг, что попали в индекс. Под каждым кадром — живой пример имени.",
    snaps: [
      { img: "snaps/spb.jpg", k: "адресная книга · 1917", t: "Санкт-Петербург", ex: "В колонке «Блонш…»: <b>Блонштейнъ Рув. Як.</b>" },
      { img: "snaps/msk.jpg", k: "адресная книга · 1917", t: "Москва", ex: "Среди «Берен…»: <b>Берендтъ Адель</b>, воспитательница." },
      { img: "snaps/len.jpg", k: "справочник жителей · 1934", t: "Ленинград", ex: "На странице «Блюм…»: <b>Блюмберг Аб. Хайм.</b>" },
      { img: "snaps/poz-names.jpg", k: "список врачей · 1939", t: "Познань", ex: "Строка в таблице: <b>Dr Kużdowicz Marian</b>, Al. Szelągowska 19." }
    ],

      ["Карточки дел", "Люди, места и организации из заголовков архивных дел. Скан оригинала — рядом, в том же индексе."]

  },
  en: {
    htmlLang: "en", dir: "ltr",
    title: "Index Archive",
    mark: "a closed working index",
    h1: "Names of people from historical directories and lists",
    lede: "City residents, merchants, doctors, taxpayers, olim, survivors, community members — anyone printed in open sources. A closed working index, not a genealogy site.",
    cta: "Open the index",
    cta_note: "Password required. Original scans open only from a search card.",
    open_k: "Where the data comes from",
    open: "Every name is taken from open, published sources: address and telephone books, printed directories, named lists. We do not harvest Yad Vashem or JewishGen.",
    ex_h: "What the sources look like",
    ex_lede: "Pages from the same books that went into the index. Each frame has a real name from that page.",
    snaps: [
      { img: "snaps/spb.jpg", k: "address book · 1917", t: "St. Petersburg", ex: "In the “Blonsh…” column: <b>Blonshtein Ruv. Yak.</b>" },
      { img: "snaps/msk.jpg", k: "address book · 1917", t: "Moscow", ex: "Among “Beren…”: <b>Berendt Adel</b>, educator." },
      { img: "snaps/len.jpg", k: "residents directory · 1934", t: "Leningrad", ex: "On the “Blyum…” page: <b>Blumberg Ab. Khaim.</b>" },
      { img: "snaps/poz-names.jpg", k: "physicians list · 1939", t: "Poznań", ex: "A row in the table: <b>Dr Kużdowicz Marian</b>, Al. Szelągowska 19." }

    src: [
      ["City residents", "Petersburg, Moscow, Breslau, Beuthen and others — as printed in published address and telephone books. A whole city, not “Jews only”."],
      ["Named lists", "Taxpayers, olim, survivors, communal and professional registers — anything that was printed or circulated as a document."],
      ["File cards", "People, places and organisations from archival file titles. The scan sits next to them in the same index."]
    ],
    yes_h: "What search does",
    yes: ["One box: name, place or organisation", "Hebrew / Latin / Russian transcriptions", "Theme and source filters after results", "Page scan from the hit card"],
    no_h: "What this is not",
    no: ["No scrape of Yad Vashem", "No scrape of JewishGen", "No open public access", "Not a family-tree or relative-finder product"],

  he: {
    htmlLang: "he", dir: "rtl",
    title: "Index Archive",
    mark: "אינדקס עבודה סגור",

    cta: "לאינדקס",

    open: "כל השמות נלקחו ממקורות גלויים שפורסמו: ספרי כתובות וטלפון, מדריכים מודפסים, רשימות שמות. אין שאיבה מ־Yad Vashem או מ־JewishGen.",
    ex_h: "איך זה נראה",
    ex_lede: "עמודים מתוך אותם ספרים שנכנסו לאינדקס. מתחת לכל תמונה — שם אמיתי מאותו עמוד.",
    snaps: [
      { img: "snaps/spb.jpg", k: "ספר כתובות · 1917", t: "סנקט פטרבורג", ex: "בעמודת «Блонш…»: <b>Блонштейнъ Рув. Як.</b>" },
      { img: "snaps/msk.jpg", k: "ספר כתובות · 1917", t: "מוסקבה", ex: "בין «Берен…»: <b>Берендтъ Адель</b>." },
      { img: "snaps/len.jpg", k: "מדריך תושבים · 1934", t: "לנינגרד", ex: "בעמוד «Блюм…»: <b>Блюмберг Аб. Хайм.</b>" },
      { img: "snaps/poz-names.jpg", k: "רשימת רופאים · 1939", t: "פוזנן", ex: "שורה בטבלה: <b>Dr Kużdowicz Marian</b>." }
    ],
    src_h: "מי מופיע כאן",
    src: [
      ["תושבי ערים", "פטרבורג, מוסקבה, ברסלאו, ביטום ואחרות — כפי שנדפסו בספרי כתובות וטלפון. עיר שלמה, לא «רק יהודים»."],
      ["רשימות שמות", "משלמי מס, עולים, ניצולים, מרשמים קהילתיים ומקצועיים — כל מה שנדפס או הופץ כמסמך."],
      ["כרטיסי תיקים", "אנשים, מקומות וארגונים מכותרות תיקים בארכיון. הסריקה לידם, באותו אינדקס."]
    ],
    yes_h: "מה החיפוש עושה",
    yes: ["שדה אחד: שם, מקום או ארגון", "תעתיקים עברית / לטינית / רוסית", "סינון לפי נושא ומקור אחרי התוצאות", "סריקת עמוד מכרטיס הפגיעה"],
    no_h: "מה אין כאן",
    no: ["אין שאיבה מ־Yad Vashem", "אין שאיבה מ־JewishGen", "אין גישה פתוחה לציבור", "זה לא אילן יוחסין ולא שירות «איתור קרובים»"],
    foot: "האינדוקס נמשך. החומר — מדריכים ורשימות שפורסמו, וקטלוג תיקים ארכיוניים."
  }
};

function apply(lang) {
  const t = T[lang] || T.ru;
  document.documentElement.lang = t.htmlLang;
  document.documentElement.dir = t.dir;
  document.title = t.title;
  document.getElementById("mark_sub").textContent = t.mark;
  document.getElementById("t_h1").textContent = t.h1;
  document.getElementById("t_lede").textContent = t.lede;
  const cta = document.getElementById("t_cta");
  cta.textContent = t.cta;
  document.getElementById("t_cta_note").textContent = t.cta_note;
  document.getElementById("t_open_k").textContent = t.open_k;
  document.getElementById("t_open").textContent = t.open;
  document.getElementById("t_ex_h").textContent = t.ex_h;
  document.getElementById("t_ex_lede").textContent = t.ex_lede;
  document.getElementById("snaps").innerHTML = t.snaps.map(s =>
    "<figure class='snap'><img src='"+s.img+"' alt='"+s.t+"'>"
    +"<figcaption><div class='k'>"+s.k+"</div><h3>"+s.t+"</h3>"
    +"<p class='ex'>"+s.ex+"</p></figcaption></figure>"
  ).join("");
  document.getElementById("t_src_h").textContent = t.src_h;
  document.getElementById("src_grid").innerHTML = t.src.map(([h,p]) =>
    "<article><h3>"+h+"</h3><p>"+p+"</p></article>"
  ).join("");
  document.getElementById("t_yes_h").textContent = t.yes_h;
  document.getElementById("t_yes").innerHTML = t.yes.map(x => "<li>"+x+"</li>").join("");
  document.getElementById("t_no_h").textContent = t.no_h;
  document.getElementById("t_no").innerHTML = t.no.map(x => "<li>"+x+"</li>").join("");
  document.getElementById("t_foot").textContent = t.foot;
  document.querySelectorAll(".langs button").forEach(b => {
    b.classList.toggle("on", b.dataset.lang === lang);
  });
  localStorage.setItem("arhiv_landing_lang", lang);
}

document.querySelectorAll(".langs button").forEach(b => {
  b.onclick = () => apply(b.dataset.lang);
});

(function init() {
  const saved = localStorage.getItem("arhiv_landing_lang");
  const nav = (navigator.language || "").toLowerCase();
  const lang = saved || "ru";
  apply(lang);
})();
</script>
</body>
</html>
